app.user.regNo=22BCE11583
app.user.email=suhailrajput325@gmail.com

# ===============================
# PostgreSQL Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/querynexus
spring.datasource.username=querynexus_user
spring.datasource.password=querynexus_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ===============================
# Resilience4j Configuration
# ===============================

# Retry configuration
resilience4j.retry.instances.webhookService.max-attempts=3
resilience4j.retry.instances.webhookService.wait-duration=2s

# Circuit Breaker configuration
resilience4j.circuitbreaker.instances.webhookService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.webhookService.sliding-window-size=5
resilience4j.circuitbreaker.instances.webhookService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.webhookService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.webhookService.permitted-number-of-calls-in-half-open-state=2

# TimeLimiter configuration
resilience4j.timelimiter.instances.webhookService.timeout-duration=5s
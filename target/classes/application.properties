# ===============================
# Application Configuration
# ===============================
spring.application.name=querynexus

# ===============================
# Server Configuration
# ===============================
server.port=9090

# ===============================
# Logging Configuration
# ===============================
logging.level.com.example.webhooksqlsolver=INFO
logging.level.org.springframework.web.client=DEBUG


# ===============================
# RESILIENCE4J CONFIGURATION
# ===============================

resilience4j.circuitbreaker.instances.webhookService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.webhookService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.webhookService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.webhookService.permittedNumberOfCallsInHalfOpenState=2

resilience4j.retry.instances.webhookService.maxAttempts=3
resilience4j.retry.instances.webhookService.waitDuration=1s
resilience4j.retry.instances.webhookService.enableExponentialBackoff=true
resilience4j.retry.instances.webhookService.exponentialBackoffMultiplier=2

resilience4j.timelimiter.instances.webhookService.timeoutDuration=5s

# ===============================
# External API Configuration
# ===============================
webhook.generate.url=https://bfhldevapigw.healthrx.co.in/hiring/generateWebhook/JAVA
# webhook.generate.url=https://invalid-url-test-12345.com
webhook.submit.url=https://bfhldevapigw.healthrx.co.in/hiring/testWebhook/JAVA
# webhook.submit.url=https://invalid-url-test-12345.com

# ===============================
# Execution Configuration
# ===============================
app.startup.enabled=false

# ===============================
# User Configuration
# ===============================
